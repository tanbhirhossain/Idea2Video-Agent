  model: qwen3.5:latest
  think: false
  num_predict: 8192
comfy:
  host: http://127.0.0.1:8188
  timeout_s: 7200
  image:
    workflow: workflows/image_qwen_image_2_1_t2i.json
    map:
      prompt:
      - 459:452
      - prompt
      negative:
      - 459:452
      - negative_prompt
      seed:
      - 459:458
      - seed
      aspect:
      - '13'
      - aspect_ratio
      megapixels:
      - '13'
      - megapixels
    fixed:
      megapixels: 3
      negative: text, captions, watermark, logo, blurry, low quality, deformed hands,
        extra fingers, cartoon
    aspect_fallback:
      '9:16': 9:16 (Portrait Widescreen)
      '16:9': 16:9 (Widescreen)
  video:
    workflow: workflows/video_minimax_h3_t2v.json
    map:
      prompt:
      - 140:131
      - prompt
      seed:
      - 140:129
      - noise_seed
      duration:
      - 140:133
      - value
      aspect:
      - '115'
      - aspect_ratio
      megapixels:
      - '115'
      - megapixels
      turbo:
      - 140:139
      - value
    fixed:
      megapixels: 1.0
      turbo: false
    min_clip_s: 5
    max_clip_s: 15
    fallback_megapixels:
    - 0.7
    - 0.45
    aspect_fallback:
      '9:16': 9:16 (Portrait Widescreen)
      '16:9': 16:9 (Widescreen)
tts:
